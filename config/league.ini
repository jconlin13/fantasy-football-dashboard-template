# Which league to archive.
#
# A league id is not a secret -- it is visible in the ESPN URL to anyone in
# the league -- so unlike the auth cookies in .env, this file is committed.
# The fetcher, the site build and the scheduled refresh all read it from here
# so there is exactly one place to change it.

[league]
# Find this in your league's ESPN URL:
#   https://fantasy.espn.com/football/team?leagueId=THIS_NUMBER&...
id =

# ESPN's history for most leagues does not go back to when the league was
# actually founded -- seasons before some point just return an HTML error
# page instead of real data, and that point is different for every league.
# Find yours by running, from the pipeline/ directory:
#
#     python3 probe.py --league-id YOUR_ID --from 2010
#
# and using the earliest season that comes back "ok" for every view.
first_season =

# The season currently being played or about to be drafted.
current_season =
