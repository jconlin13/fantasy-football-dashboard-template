name: Probe league history

# One-off diagnostic, not part of the regular pipeline. Run this from the
# Actions tab (no local Python, no terminal needed) to find out how far back
# your league's ESPN history actually goes before filling in league.ini's
# first_season -- some seasons before a certain point just return an HTML
# error page instead of real data, and that point is different per league.
# Read the results in this run's own log.
on:
  workflow_dispatch:
    inputs:
      league_id:
        description: "Your league id (from the ESPN URL)"
        required: true
      from_year:
        description: "Earliest year to check (guess low, e.g. 2010)"
        required: true
        default: "2010"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Probe
        # league_id and from_year are typed by whoever runs this from the
        # Actions tab. Interpolating ${{ inputs.x }} straight into the shell
        # script text (the pattern this replaced) means GitHub substitutes
        # the raw input into the script *before* the shell ever sees it --
        # a value containing shell metacharacters becomes new commands, run
        # in this same step where SWID/ESPN_S2 already sit in the
        # environment. Routing both through env: instead means the shell
        # only ever sees them as the *value* of a variable, never as script
        # source, so nothing in them can execute regardless of what's typed.
        env:
          SWID: ${{ secrets.SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          LEAGUE_ID: ${{ inputs.league_id }}
          FROM_YEAR: ${{ inputs.from_year }}
        run: |
          cd pipeline
          python3 probe.py --league-id "$LEAGUE_ID" --from "$FROM_YEAR"
